const te=new TextEncoder(),td=new TextDecoder(),sub=crypto&&crypto.subtle;
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const $=id=>document.getElementById(id),msg=t=>{$('m').textContent=t};
let fails=0;
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
if(!sub){msg('This browser cannot unlock the app (secure connection required).');$('b').disabled=true}
$('s').onchange=e=>{$('p').type=e.target.checked?'text':'password'};
const derive=(base,salt,usage)=>sub.deriveKey({name:'PBKDF2',salt,iterations:PL.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,usage);
async function unlock(pass){
 const base=await sub.importKey('raw',te.encode(pass.normalize('NFKC')),'PBKDF2',false,['deriveKey']);
 let ds=null;try{ds=localStorage.getItem('invoice_desk_dsalt')}catch(e){}
 const fresh=!ds;if(fresh)ds=b64(crypto.getRandomValues(new Uint8Array(16)));
 const [shellKey,dataKey]=await Promise.all([derive(base,ub(PL.salt),['decrypt']),derive(base,ub(ds),['encrypt','decrypt'])]);
 let html;
 try{html=td.decode(await sub.decrypt({name:'AES-GCM',iv:ub(PL.iv),additionalData:te.encode('shell1')},shellKey,ub(PL.ct)))}catch(e){return'bad'}
 const M=new Map(),P='enc1:';let keys=[];
 try{keys=Object.keys(localStorage)}catch(e){}
 for(const k of keys){if(!k.startsWith(P))continue;const [a,b]=localStorage.getItem(k).split('.'),name=k.slice(P.length);
  try{M.set(name,td.decode(await sub.decrypt({name:'AES-GCM',iv:ub(a),additionalData:te.encode(name)},dataKey,ub(b))))}catch(e){return'data'}}
 const mig=[];
 for(const k of keys){if(k.startsWith('invoice_app_')&&!M.has(k)){M.set(k,localStorage.getItem(k));mig.push(k)}}
 for(const k of mig){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await sub.encrypt({name:'AES-GCM',iv,additionalData:te.encode(k)},dataKey,te.encode(M.get(k))));
  localStorage.setItem(P+k,b64(iv)+'.'+b64(ct));localStorage.removeItem(k)}
 if(fresh)localStorage.setItem('invoice_desk_dsalt',ds);
 window.__DK=dataKey;window.__LSD=M;
 document.open();document.write(html);document.close();return'ok'}
$('f').onsubmit=async e=>{e.preventDefault();const p=$('p'),b=$('b');if(!p.value)return;
 b.disabled=true;b.textContent='Unlocking…';msg('');
 let r='err';try{r=await unlock(p.value)}catch(x){r='err'}
 if(r==='ok')return;
 p.value='';b.textContent='Unlock';
 if(r==='bad'){fails++;msg('Wrong passphrase.');await new Promise(z=>setTimeout(z,Math.min(6000,400*2**fails)))}
 else if(r==='data')msg('That passphrase opens the app but does not match the data saved on this phone. Use the original passphrase.');
 else msg('Could not unlock. Please try again.');
 b.disabled=false;p.focus()};
})();
